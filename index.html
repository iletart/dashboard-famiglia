function buildLayout(view){
  var views = DASHBOARD_VIEWS || [];
  var vc = null;
  var i, j, el, b;
  var rows, items, row, item;
  var isRows, host, stash;

  for(i = 0; i < views.length; i++){
    if(views[i].id === view){
      vc = views[i];
      break;
    }
  }

  if(!vc){ return; }

  rows = (vc.rows || []).slice();
  rows.sort(function(a, b){
    return a.position - b.position;
  });

  isRows = vc.layout_mode === "rows";
  host = view === "famiglia" ? $("dashboardContent") : personalRow();
  stash = $("stash");

  if(!host || !stash){ return; }

	for(var v = 0; v < views.length; v++){
	  var allRows = views[v].rows || [];

	  for(i = 0; i < allRows.length; i++){
		items = allRows[i].items || [];

		for(j = 0; j < items.length; j++){
		  el = $(items[j].element_id);
		  if(el && el.parentNode !== stash){
			stash.appendChild(el);
		  }
		}
	  }
	}

  clear(host);

  for(i = 0; i < rows.length; i++){
    row = rows[i];
    items = (row.items || []).slice();

    items.sort(function(a, b){
      return a.position - b.position;
    });

    var container = mk(
      "div",
      isRows ? "row layout-row" : "col layout-column"
    );

    host.appendChild(container);

    var n = isRows ? Math.min(items.length, 2) : items.length;

    for(j = 0; j < n; j++){
      item = items[j];
      b = $(item.element_id);

      if(!b){ continue; }

      setHidden(b, false);

      if(isRows){
        var col = mk("div", n === 1 ? "col full" : "col");
        col.appendChild(b);
        container.appendChild(col);
      } else {
        container.appendChild(b);
      }
    }
  }
}


function setView(view, manual){
  if(manual){ viewManualUntil = Date.now() + 10 * 60 * 1000; }
  currentView = view; 

  var btns = $("viewMenuPanel").getElementsByTagName("button");
  for(var i = 0; i < btns.length; i++){
    btns[i].className = btns[i].getAttribute("data-view") === view ? "sel" : "";
  }

  var personal = view !== "famiglia";
  setHidden($("dashboardContent"), personal);
  setHidden($("personalView"), !personal);

  buildLayout(view);
  safe(loadShoppingList);

  /* box riservati a una sola vista (data-only) */
  var only = document.querySelectorAll(".box[data-only]");
  for(i = 0; i < only.length; i++){
    setHidden(only[i], only[i].getAttribute("data-only") !== view);
  }

  renderAgenda();
  
  if(personal){
    safe(renderPersonalTasks);
  
    if(view !== "famiglia" && viewHasBox(view, "personalRoutes")){
      loadRoutes(view);
    }
  
    if(viewHasBox(view, "userAgenda")){
      renderUserAgenda();
      loadUserAgenda(view);
    }
  }

  closeViewMenu();
  scheduleAlign();
}

  var title = mk("div", "", "AGGIUNGI UTENTE");
  title.style.textAlign = "center";
  title.style.fontSize = "18px";
  title.style.fontWeight = "bold";
  box.appendChild(title);

  function createField(placeholder, type, maxLength){
    var input = document.createElement("input");
    input.type = type;
    input.placeholder = placeholder;
    input.maxLength = maxLength;
    input.style.width = "100%";
    input.style.minWidth = "0";
    input.style.height = "40px";
    input.style.padding = "6px 10px";
    input.style.boxSizing = "border-box";
    input.style.fontSize = "16px";
    box.appendChild(input);
    return input;
  }

  var idInput = createField("ID accesso (es. nonno)", "text", 30);
  var nameInput = createField("Nome visualizzato", "text", 60);
  var ownerInput = createField("Codice attività (es. N)", "text", 10);
  ownerInput.style.textTransform = "uppercase";

  var pinInput = createField("PIN (6-12 cifre)", "password", 12);
  pinInput.inputMode = "numeric";
  var confirmInput = createField("Conferma PIN", "password", 12);
  confirmInput.inputMode = "numeric";

  var error = mk("div", "", "");
  error.style.color = "#c00";
  error.style.textAlign = "center";
  box.appendChild(error);

  var saveButton = mk("button", "", "CREA UTENTE");
  saveButton.type = "button";
  saveButton.style.width = "100%";
  saveButton.style.padding = "14px";

  var cancelButton = mk("button", "", "ANNULLA");
  cancelButton.type = "button";
  cancelButton.style.width = "100%";
  cancelButton.style.padding = "12px";
  cancelButton.onclick = renderViewMenu;

  saveButton.onclick = function(){
    var id = idInput.value.trim().toLowerCase();
    var name = nameInput.value.trim();
    var taskOwner = ownerInput.value.trim().toUpperCase();
    var pin = pinInput.value.trim();
    var pinConfirm = confirmInput.value.trim();

    if(!/^[a-z0-9_-]{2,30}$/.test(id) || id === "famiglia"){
      error.textContent = "ID non valido: usa 2-30 caratteri (lettere, numeri, _ o -).";
      idInput.focus();
      return;
    }

    if(!name || name.length > 60){
      error.textContent = "Inserisci un nome valido.";
      nameInput.focus();
      return;
    }

    if(!/^[A-Z0-9_-]{1,10}$/.test(taskOwner)){
      error.textContent = "Inserisci un codice attività valido.";
      ownerInput.focus();
      return;
    }

    if(!/^\d{6,12}$/.test(pin)){
      error.textContent = "Il PIN deve contenere da 6 a 12 cifre.";
      pinInput.focus();
      return;
    }

    if(pin !== pinConfirm){
      error.textContent = "I PIN non coincidono.";
      confirmInput.focus();
      return;
    }

    error.textContent = "";
    saveButton.disabled = true;
    saveButton.textContent = "CREAZIONE IN CORSO...";

    authRequest("POST", "/users/create", {
      id: id,
      name: name,
      task_owner: taskOwner,
      pin: pin,
      pin_confirm: pinConfirm
    }, function(err, data){

      if(err || !data || !data.ok){
        error.textContent = err || "Creazione non riuscita.";
        saveButton.disabled = false;
        saveButton.textContent = "CREA UTENTE";
        return;
      }

      alert("Utente " + data.user.name + " creato correttamente.");

      // Ricarica la dashboard per aggiornare utenti,
      // assegnatari e configurazione delle viste.
      location.reload();
    });
  };

  box.appendChild(saveButton);
  box.appendChild(cancelButton);
  panel.appendChild(box);

  idInput.focus();
}

  // ELENCO PROFILI

      if(ev){
        ev.preventDefault();
        ev.stopPropagation();
      }

      if(!authToken){
        panel._pendingLoginProfile = id;
        renderViewMenu();
      } else {
        personalPeriod = "oggi";
        setView(id, true);
      }
    };

    panel.appendChild(b);
  }

  addButton("famiglia", "FAMIGLIA");

  for(var i = 0; i < USERS.length; i++){
    addButton(USERS[i].id, USERS[i].name);

  // AGGIUNGI UTENTE: solo nella vista FAMIGLIA,
  // con sessione autenticata come famiglia.

     typeof currentView !== "undefined" && currentView === "famiglia"){

    var addUserButton = mk("button", "", "+ AGGIUNGI UTENTE");

function updateLoggedUser(){
  var el = $("loggedUser");

  if(!el){ return; }

  if(!authToken || !authProfile){
    el.textContent = "";
    return;
  }

  el.textContent = "Utente collegato: " + userName(authProfile);

function initViewMenu(){
  var toggle = $("viewMenuToggle");
  var panel = $("viewMenuPanel");

  if(!menuInitialized){
    toggle.onclick = function(){
      var open = panel.hasAttribute("hidden");
      setHidden(panel, !open);
      toggle.setAttribute("aria-expanded", open ? "true" : "false");
    };

    document.addEventListener("click", function(ev){
      var menu = $("viewMenu");
      if(menu && !menu.contains(ev.target)){
        closeViewMenu();
      }
    });

    document.addEventListener("keydown", function(ev){
      if(ev.key === "Escape"){
        closeViewMenu();
      }
    });

    menuInitialized = true;
  }

  renderViewMenu();
}

/* ==================================================
   16. ALLINEAMENTO ALTEZZE DEI BOX
   ================================================== */
var alignTimer = null;

function hasClass(el, name){ return (" " + (el.className || "") + " ").indexOf(" " + name + " ") !== -1; }

function boxesOf(el){
  var r = [], k = el.children;
  for(var i = 0; i < k.length; i++){
    if(hasClass(k[i], "box") && !k[i].hasAttribute("hidden")){ r.push(k[i]); }
  }
  return r;
}

function columnHeight(bs){
  var h = 0;
  for(var i = 0; i < bs.length; i++){ h += bs[i].offsetHeight + 6; }   /* 6 = margini del box */
  return h;
}

/* Distribuisce extra px tra i box di una colonna; l'ultimo assorbe l'arrotondamento */
function growColumn(bs, extra){
  var each = Math.floor(extra / bs.length), used = 0;
  for(var i = 0; i < bs.length; i++){
    var add = (i === bs.length - 1) ? extra - used : each;
    used += add;
    bs[i].style.minHeight = (bs[i].offsetHeight + add) + "px";
  }
}



function alignBoxes(){
  var host = currentView === "famiglia"
    ? $("dashboardContent")
    : personalRow();

  if(!host){ return; }

  var columns = host.querySelectorAll(".layout-column");
  var rows = host.querySelectorAll(".layout-row");
  var all = host.querySelectorAll(".box");
  var i, j, boxes, maxHeight = 0;

  /* Reset delle altezze */
  for(i = 0; i < all.length; i++){
	all[i].style.minHeight = "";
	all[i].style.height = "";
	all[i].style.flexGrow = "";
  }

  /* COLONNE: calcola l'altezza naturale della più alta */
  for(i = 0; i < columns.length; i++){
    boxes = boxesOf(columns[i]);
    var height = columnHeight(boxes);
    maxHeight = Math.max(maxHeight, height);
  }

  /* Allunga solo l'ultimo box di ogni colonna */
  for(i = 0; i < columns.length; i++){
    boxes = boxesOf(columns[i]);

    if(!boxes.length){ continue; }

    var currentHeight = columnHeight(boxes);
    var extra = maxHeight - currentHeight;

    if(extra > 1){
      var last = boxes[boxes.length - 1];
      last.style.height = (last.offsetHeight + extra) + "px";
    }
  }

  /* RIGHE: uniforma i box affiancati */
  for(i = 0; i < rows.length; i++){
    var firsts = [];
    var max = 0;

    for(j = 0; j < rows[i].children.length; j++){
      boxes = boxesOf(rows[i].children[j]);

      if(boxes.length){
        firsts.push(boxes[0]);
        max = Math.max(max, boxes[0].offsetHeight);
      }
    }

    for(j = 0; j < firsts.length; j++){
      firsts[j].style.minHeight = max + "px";
    }
  }
}


function scheduleAlign(){
  if(alignTimer){ clearTimeout(alignTimer); }
  alignTimer = setTimeout(function(){ alignTimer = null; safe(alignBoxes); }, 50);
}

window.onresize = scheduleAlign;
window.addEventListener("load", scheduleAlign);

function authRequest(method, path, body, callback){
  var x = new XMLHttpRequest();
  x.open(method, AUTH_URL + path, true);
  x.timeout = 20000;

  if(body !== null){
    x.setRequestHeader("Content-Type", "application/json");
  }

  if(authToken){
    x.setRequestHeader("Authorization", "Bearer " + authToken);
  }

  x.onreadystatechange = function(){
    if(x.readyState !== 4){ return; }

    var data = null;
    try { data = JSON.parse(x.responseText); } catch(e){}

    if(x.status >= 200 && x.status < 300){
      callback(null, data);
    } else {
      callback(data && data.error ? data.error : "Errore HTTP " + x.status);
    }
  };

  x.onerror = function(){ callback("Errore di connessione"); };
  x.ontimeout = function(){ callback("Timeout"); };

  x.send(body === null ? null : JSON.stringify(body));
}

function loadAuthorizedConfig(callback){
  var x = new XMLHttpRequest();
  x.open("GET", DASHBOARD_API_URL + "/config", true);
  x.setRequestHeader("Authorization", "Bearer " + authToken);
  x.timeout = 20000;

  x.onreadystatechange = function(){
    if(x.readyState !== 4){ return; }

    var data = null;
    try { data = JSON.parse(x.responseText); } catch(e){}

    if(x.status !== 200 || !data || !data.ok ||
       !Array.isArray(data.views) ||
       !Array.isArray(data.users)){
      callback("Configurazione non disponibile");
      return;
    }

    DASHBOARD_VIEWS = data.views;

    USERS = data.users.filter(function(u){
      return u && u.id && u.name;
    });

    callback(null);
  };

  x.onerror = function(){ callback("Errore di connessione"); };
  x.ontimeout = function(){ callback("Timeout"); };
  x.send(null);
}

function clearAuthStorage(){
  try {
    localStorage.removeItem("dashboardAuthToken");
    localStorage.removeItem("dashboardAuthProfile");
    localStorage.removeItem("dashboardAuthSessionId");
  } catch(e){}
}

function showLoggedOut(message){
  authToken = "";
  authProfile = "";
  authSessionId = "";
  updateLoggedUser();
  DASHBOARD_VIEWS = [];

  clearAuthStorage();
  setHidden($("head"), false);
  setHidden($("dashboardContent"), true);
  setHidden($("personalView"), true);
  clear($("err"));

function startDashboard(preferredView){
  loadAuthorizedConfig(function(err){
    if(err){
      showLoggedOut("Configurazione dashboard non disponibile: " + err);
      return;
    }

    clear($("err")); // AGGIUNGI QUESTA RIGA

    setHidden($("head"), false);
    setHidden($("dashboardContent"), false);
    renderViewMenu();
    setView(preferredView || getScheduledView(), false);
	
	bindSeg("taskDays", function(day){
	  taskSel = day;
	  renderTasks();
	});

	bindSeg("personalGlobalTaskDays", function(day){
	  personalGlobalTaskSel = day;
	  renderPersonalGlobalTasks();
	});

	bindSeg("menuDays", function(day){
	  menuSel = day;
	  loadMenu();
	});
	
	bindSeg("personalPeriod", function(day){
	  personalPeriod = day;
	  renderPersonalTasks();
	});
	
	// Aggiunta task giornalieri
	$("taskAddButton").onclick = function(){
	  var input = $("taskInput");
	  var value = input.value.trim();

	  if(!value){ return; }

	  if(taskPost({
		action: "add",
		date: taskKey(taskSel),
		text: value
	  }, false)){
		input.value = "";
	  }
	};

	// Aggiunta task condivisi
	$("todoAddButton").onclick = function(){
	  var input = $("todoInput");
	  var value = input.value.trim();

	  if(!value){ return; }

	  if(todoChange("add", null, value)){
		input.value = "";
	  }
	};

	// Invio da tastiera
	$("taskInput").onkeydown = function(ev){
	  if(ev.key === "Enter"){
		ev.preventDefault();
		$("taskAddButton").click();
	  }
	};

	$("todoInput").onkeydown = function(ev){
	  if(ev.key === "Enter"){
		ev.preventDefault();
		$("todoAddButton").click();
	  }
	};

    safe(loadAgenda);
    safe(loadShoppingList);
    safe(loadWeather);
    safe(loadSunTimes);
    safe(loadMenu);
    safe(loadTodo);

	if(!scheduleViewTimer){
	  scheduleViewTimer = setInterval(checkScheduledView, 15000);
	}

	if(!sunTimesTimer){
	  sunTimesTimer = setInterval(function(){
		safe(loadSunTimes);
	  }, 3600000);
	}

	if(!shoppingRefreshTimer){
	  shoppingRefreshTimer = setInterval(function(){
		safe(loadShoppingList);

		if(viewHasBox(currentView, "personalRoutes")){
		  safe(function(){
			loadRoutes(currentView);
		  });
		}
	  }, 5 * 60000);
	}
  });
}

function authLogin(profile, pin){
  if(!profile){ return; }

  pin = String(pin || "").trim();

  if(!/^\d{6,12}$/.test(pin)){
    alert("Il PIN deve contenere da 6 a 12 cifre.");
    return;
  }

  authRequest("POST", "/login", {
    profile: profile,
    pin: pin
  }, function(err, data){
    if(err || !data || !data.ok){
      alert(err || "Accesso non riuscito.");
      return;
    }

    authToken = data.token;
    authProfile = data.profile;
	updateLoggedUser();
    authSessionId = data.session_id || "";

    try {
      localStorage.setItem("dashboardAuthToken", authToken);
      localStorage.setItem("dashboardAuthProfile", authProfile);
      localStorage.setItem("dashboardAuthSessionId", authSessionId);
    } catch(e){}

    var panel = $("viewMenuPanel");
    if(panel){ panel._pendingLoginProfile = null; }

    startDashboard(profile);
  });
}

function authLogout(){
  if(!authToken){ return; }

  authRequest("POST", "/logout", null, function(){
    showLoggedOut("Sessione terminata. Seleziona un profilo dal menu.");
  });
}

function restoreAuthSession(){
  try {
    authToken = localStorage.getItem("dashboardAuthToken") || "";
    authProfile = localStorage.getItem("dashboardAuthProfile") || "";
    authSessionId = localStorage.getItem("dashboardAuthSessionId") || "";
  } catch(e){
    authToken = "";
    authProfile = "";
    authSessionId = "";
  }

  if(!authToken){
    renderViewMenu();
    return;
  }

  authRequest("POST", "/session/verify", null, function(err, data){

    // Errore di rete: conserviamo la sessione e non facciamo logout.
    if(err){
      setHidden($("head"), false);
      setHidden($("dashboardContent"), true);
      setHidden($("personalView"), true);
      setText($("err"), "Connessione temporaneamente non disponibile. Riprovo al prossimo accesso.");
      return;
    }

    // Sessione realmente scaduta o non valida.
    if(!data || !data.ok){
      showLoggedOut("Sessione scaduta. Seleziona un profilo dal menu.");
      return;
    }

    authToken = localStorage.getItem("dashboardAuthToken") || authToken;
    authProfile = data.profile;
    authSessionId = data.session_id || "";

    updateLoggedUser();
    startDashboard();
  });
}

restoreAuthSession();
